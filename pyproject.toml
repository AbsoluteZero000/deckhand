[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckhand"
version = "0.1.0"
description = "Agent-editable flashcards kept as YAML in your own private repo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
deckhand = "deckhand.cli:main"

[tool.setuptools]
packages = ["deckhand"]
include-package-data = true

[tool.setuptools.package-data]
deckhand = ["template/**/*", "template/**/.*"]
